server:
  port: 8080

spring:
  application:
    name: quanfan-mall
  datasource:
    url: jdbc:mysql://localhost:3306/quanfan_mall?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
    username: root
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 0
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.quanfan.mall.model.entity
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false

# JWT
jwt:
  secret: ${JWT_SECRET:QuanFanMallSecretKey2026ChangeThisInProduction}
  expire: 604800 # 7 days

# Logging
logging:
  level:
    com.quanfan.mall: debug
